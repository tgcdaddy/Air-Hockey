<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Air Hockey">
<meta name="theme-color" content="#07102a">
<title>Air Hockey Online</title>
<link rel="apple-touch-icon" id="ati" href="">
<link rel="manifest" id="mf" href="">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#07102a;overflow:hidden}
body{position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:Tahoma,"Geeza Pro","Segoe UI",Arial,sans-serif;color:#eaf6ff}
canvas{position:fixed;top:0;left:0;display:block;touch-action:none}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);box-sizing:border-box;background:rgba(5,10,28,.55)}
body.land #ui{padding-left:calc(env(safe-area-inset-left) + 30px);padding-right:calc(env(safe-area-inset-right) + 30px)}
.card{display:none;flex-direction:column;align-items:stretch;gap:12px;width:100%;max-width:380px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box;padding:20px 18px;border-radius:22px;background:rgba(10,22,56,.86);border:1px solid rgba(0,229,255,.35);box-shadow:0 0 30px rgba(0,160,255,.25);text-align:center}
.card.on{display:flex}
h1{margin:0;font-size:34px;letter-spacing:0;color:#fff;text-shadow:0 0 14px #00e5ff}
h2{margin:0;font-size:22px;color:#fff}
p{margin:0;font-size:15px;line-height:1.5;color:#b9d7f5}
.sub{color:#7fe9ff;font-size:14px}
button,input,textarea{font-family:inherit;font-size:18px;border-radius:14px;border:0;outline:0;box-sizing:border-box;touch-action:manipulation}
button{min-height:52px;padding:10px 16px;color:#06122b;font-weight:bold;background:linear-gradient(#5cf0ff,#00b8e6);box-shadow:0 3px 0 #007a99;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #007a99}
button.wa{background:linear-gradient(#5dea8a,#1fb85a);box-shadow:0 3px 0 #11803c;color:#032611}
button.ghost{background:rgba(255,255,255,.08);color:#cfe8ff;box-shadow:none;border:1px solid rgba(255,255,255,.18);min-height:44px;font-size:16px}
button:disabled{opacity:.5}
input,textarea{-webkit-user-select:text;user-select:text;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(0,229,255,.4);padding:12px;text-align:center}
input{text-transform:uppercase;letter-spacing:6px;font-size:22px;font-weight:bold;min-width:0;width:100%}
textarea{font-size:13px;height:90px;resize:none;text-align:left;letter-spacing:0;font-family:monospace}
.row{display:flex;gap:10px}
.row>*{flex:1}
.row>input{flex:1.4}
#codeShow{font-size:44px;font-weight:bold;letter-spacing:8px;color:#00e5ff;text-shadow:0 0 16px #00a8ff;padding:6px 0}
#hudBtns button{position:fixed;z-index:5;width:44px;height:44px;min-height:44px;padding:0;border-radius:22px;background:rgba(10,22,56,.7);border:1px solid rgba(0,229,255,.45);box-shadow:none;color:#cfeaff;display:none;align-items:center;justify-content:center}
#mute{display:flex!important;top:calc(env(safe-area-inset-top) + 8px);right:12px}
#quit{top:calc(env(safe-area-inset-top) + 8px);left:12px;width:auto!important;padding:0 14px!important;font-size:14px!important}
body.land #mute{right:calc(env(safe-area-inset-right) + 30px)}
body.land #quit{left:calc(env(safe-area-inset-left) + 30px)}
body.playing #quit{display:flex}
body.land .card{padding:12px 16px;gap:8px}
body.land #codeShow{font-size:32px;padding:0}
body.land button{min-height:42px;padding:6px 14px}
body.land h1{font-size:28px}
.seg{position:relative;display:flex;padding:3px;border-radius:13px;background:rgba(255,255,255,.12);touch-action:none;-webkit-user-select:none}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;background:linear-gradient(#5cf0ff,#00b8e6);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .28s cubic-bezier(.3,1.2,.4,1);pointer-events:none}
.seg button{position:relative;z-index:1;flex:1;min-height:40px;padding:0 6px;background:none;box-shadow:none;color:#cfe8ff;font-size:16px;transition:color .2s}
.seg button.sel{color:#06122b}
.seg button:active{transform:none}
.pane{display:none;flex-direction:column;gap:12px}
.pane.on{display:flex}
svg{width:24px;height:24px;fill:none;stroke:#cfeaff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="card on" id="s-menu">
    <h1>Air Hockey</h1>
    <p class="sub">Play the computer, or a friend online</p>
    <div class="seg" id="segMode"><div class="thumb"></div><button type="button">Computer</button><button type="button">Friend</button></div>
    <div id="pane-cpu" class="pane">
      <p>Difficulty</p>
      <div class="seg" id="segLvl"><div class="thumb"></div><button type="button">Easy</button><button type="button">Medium</button><button type="button">Hard</button></div>
      <button id="bPlayCpu">Play</button>
    </div>
    <div id="pane-friend" class="pane">
      <button id="bCreate">Create room &amp; share code</button>
      <p>or join with your friend's code</p>
      <div class="row"><input id="inCode" maxlength="5" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="CODE"><button id="bJoin">Join</button></div>
      <button class="ghost" id="bManual">Not connecting? Try manual mode</button>
    </div>
    <p id="stats" class="sub"></p>
  </div>
  <div class="card" id="s-wait">
    <h2>Room ready</h2>
    <p>Send the code or link to your friend</p>
    <div id="codeShow">-----</div>
    <p id="waitSt" class="sub">Setting up the room...</p>
    <button class="wa" id="bWA" disabled>Send via WhatsApp</button>
    <button id="bCopy" disabled>Copy link</button>
    <button class="ghost" id="bCancel1">Back</button>
  </div>
  <div class="card" id="s-join">
    <h2>Joining the room...</h2>
    <p id="joinSt">Connecting to your friend in a moment</p>
    <button class="ghost" id="bCancel2">Cancel</button>
  </div>
  <div class="card" id="s-msg">
    <h2 id="msgT">Notice</h2>
    <p id="msgP"></p>
    <button id="bMsgOk">Back to menu</button>
  </div>
  <div class="card" id="s-over">
    <h2 id="ovT"></h2>
    <p id="ovP" class="sub"></p>
    <button id="bAgain">Play again</button>
    <button class="ghost" id="bExit">Exit</button>
  </div>
  <div class="card" id="s-man">
    <h2>Manual mode</h2>
    <p id="manHint"></p>
    <div class="row"><button id="manH">I start</button><button id="manG">I join</button></div>
    <textarea id="manOut" readonly placeholder="Your code will appear here"></textarea>
    <div class="row"><button class="wa" id="manWA" disabled>WhatsApp</button><button id="manCopy" disabled>Copy</button></div>
    <textarea id="manIn" placeholder="Paste the code you received here"></textarea>
    <button id="manGo" disabled>Continue</button>
    <button class="ghost" id="bCancel3">Back</button>
  </div>
</div>
<div id="hudBtns">
  <button id="mute" aria-label="sound"></button>
  <button id="quit">Exit</button>
</div>
